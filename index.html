<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#1a237e"/>
<title>Scripture — Complete Bible App</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"/>

<style>
  :root {
    --md-primary: #1a237e;
    --md-primary-light: #534bae;
    --md-primary-dark: #000051;
    --md-secondary: #b8860b;
    --md-secondary-light: #f5c842;
    --md-surface: #ffffff;
    --md-surface-variant: #f5f5f5;
    --md-on-surface: #1c1b1f;
    --md-on-surface-variant: #49454f;
    --md-outline: #79747e;
    --md-shadow: rgba(0,0,0,0.12);
    --md-scrim: rgba(0,0,0,0.32);
    --md-error: #b3261e;
    --reader-bg: #faf8f3;
    --reader-text: #2d2a22;
    --reader-verse-num: #8b6914;
    --reader-highlight-y: rgba(255,235,59,0.45);
    --reader-highlight-g: rgba(76,175,80,0.35);
    --reader-highlight-b: rgba(33,150,243,0.35);
    --reader-highlight-p: rgba(156,39,176,0.35);
    --reader-highlight-r: rgba(244,67,54,0.35);
    --nav-height: 64px;
    --sidebar-width: 320px;
    --font-reader: 'Merriweather', Georgia, serif;
    --font-ui: 'Inter', system-ui, sans-serif;
    --font-size-reader: 17px;
    --line-height-reader: 1.85;
    --letter-spacing-reader: 0.01em;
  }
  [data-theme="dark"] {
    --md-primary: #9fa8da;
    --md-primary-light: #d1d9ff;
    --md-primary-dark: #6f79a8;
    --md-secondary: #f5c842;
    --md-surface: #1c1b1f;
    --md-surface-variant: #2b2930;
    --md-on-surface: #e6e1e5;
    --md-on-surface-variant: #cac4d0;
    --md-outline: #938f99;
    --md-shadow: rgba(0,0,0,0.4);
    --md-scrim: rgba(0,0,0,0.6);
    --reader-bg: #1a1814;
    --reader-text: #e8e0cc;
    --reader-verse-num: #c9a84c;
    --reader-highlight-y: rgba(255,235,59,0.25);
    --reader-highlight-g: rgba(76,175,80,0.22);
    --reader-highlight-b: rgba(33,150,243,0.22);
    --reader-highlight-p: rgba(156,39,176,0.22);
    --reader-highlight-r: rgba(244,67,54,0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: var(--font-ui); background: var(--md-surface); color: var(--md-on-surface); }
  .material-icons-round { font-family: 'Material Icons Round'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-smoothing: antialiased; user-select: none; }

  /* ========== APP SHELL ========== */
  #app { display: flex; flex-direction: column; height: 100vh; max-height: 100vh; background: var(--md-surface); }
  #top-bar { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; height: 64px; min-height: 64px; background: var(--md-primary); color: #fff; z-index: 120; box-shadow: 0 2px 8px var(--md-shadow); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -ms-overflow-style: none; }
  #top-bar::-webkit-scrollbar { display: none; }
  [data-theme="dark"] #top-bar { background: #12111a; border-bottom: 1px solid #2b2930; }
  #top-bar .logo { font-family: 'Crimson Pro', serif; font-size: 22px; font-weight: 600; letter-spacing: 0.5px; color: #fff; flex-shrink: 0; white-space: nowrap; }
  #top-bar .spacer { flex: 1; min-width: 8px; }
  .icon-btn { width: 48px; height: 48px; border-radius: 50%; border: none; background: transparent; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0; }
  .icon-btn:hover { background: rgba(255,255,255,0.12); }
  .icon-btn:active { background: rgba(255,255,255,0.22); }
  [data-theme="dark"] .icon-btn { color: var(--md-on-surface); }
  @media (max-width: 420px) {
    #top-bar .logo { font-size: 17px; }
    .icon-btn { width: 40px; height: 40px; }
    .icon-btn .material-icons-round { font-size: 21px; }
    #top-bar { gap: 2px; padding: 0 4px; }
  }

  /* ========== MAIN LAYOUT ========== */
  #main-layout { display: flex; flex: 1; overflow: hidden; }
  #sidebar { position: fixed; top: 64px; left: 0; bottom: 0; width: var(--sidebar-width); max-width: 86vw; overflow: hidden; background: var(--md-surface-variant); border-right: 1px solid var(--md-outline); transition: transform 0.28s cubic-bezier(0.4,0,0.2,1); transform: translateX(-100%); display: flex; flex-direction: column; z-index: 110; box-shadow: 4px 0 24px rgba(0,0,0,0.18); }
  #sidebar.open { transform: translateX(0); }
  #sidebar-backdrop { position: fixed; top: 64px; left: 0; right: 0; bottom: 0; background: var(--md-scrim); z-index: 105; opacity: 0; pointer-events: none; transition: opacity 0.22s ease; }
  #sidebar-backdrop.open { opacity: 1; pointer-events: auto; }
  #content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  /* NOTE: Commentary & Context used to be a right-side push panel (#right-panel).
     It's now a bottom-sheet modal (see openCommentaryPanel()) built with the
     existing showModal(..., true) bottom-sheet system, so no dedicated
     panel CSS is needed here anymore. */

  /* ========== BOTTOM NAV (MOBILE) ========== */
  #bottom-nav { display: flex; height: 64px; min-height: 64px; background: var(--md-surface); border-top: 1px solid rgba(0,0,0,0.1); z-index: 100; }
  [data-theme="dark"] #bottom-nav { border-top: 1px solid #2b2930; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--md-on-surface-variant); transition: color 0.2s; border: none; background: transparent; padding: 4px 0; min-height: 48px; }
  .nav-item.active { color: var(--md-primary); }
  [data-theme="dark"] .nav-item.active { color: var(--md-primary-light); }
  .nav-item .nav-label { font-size: 10px; font-weight: 500; letter-spacing: 0.3px; }
  .nav-indicator { width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .nav-item.active .nav-indicator { background: rgba(26,35,126,0.12); }
  [data-theme="dark"] .nav-item.active .nav-indicator { background: rgba(159,168,218,0.16); }

  /* ========== SIDEBAR CONTENT ========== */
  .sidebar-inner { width: var(--sidebar-width); display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .sidebar-header { padding: 16px; font-size: 13px; font-weight: 600; color: var(--md-on-surface-variant); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--md-outline); display: flex; align-items: center; gap: 8px; }
  .sidebar-search { padding: 12px; border-bottom: 1px solid var(--md-outline); }
  .search-field { display: flex; align-items: center; gap: 8px; background: var(--md-surface); border: 1px solid var(--md-outline); border-radius: 28px; padding: 0 16px; height: 44px; }
  .search-field input { border: none; background: transparent; flex: 1; font-size: 14px; color: var(--md-on-surface); outline: none; }
  .search-field .material-icons-round { color: var(--md-on-surface-variant); font-size: 20px; }
  .book-list { flex: 1; overflow-y: auto; }
  .book-list::-webkit-scrollbar { width: 4px; }
  .book-list::-webkit-scrollbar-track { background: transparent; }
  .book-list::-webkit-scrollbar-thumb { background: var(--md-outline); border-radius: 2px; }
  .testament-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 0 2px; align-items: start; }
  .testament-col { display: flex; flex-direction: column; min-width: 0; }
  .testament-label { padding: 10px 10px 4px; font-size: 11px; font-weight: 700; color: var(--md-secondary); text-transform: uppercase; letter-spacing: 1.2px; }
  .book-item { display: flex; align-items: center; padding: 8px 8px; cursor: pointer; border-radius: 4px; margin: 1px 2px; transition: background 0.15s; color: var(--md-on-surface); font-size: 13px; gap: 4px; }
  .book-item:hover { background: rgba(0,0,0,0.05); }
  [data-theme="dark"] .book-item:hover { background: rgba(255,255,255,0.05); }
  .book-item.active { background: rgba(26,35,126,0.12); color: var(--md-primary); font-weight: 600; }
  [data-theme="dark"] .book-item.active { background: rgba(159,168,218,0.16); color: var(--md-primary-light); }
  .book-item .book-abbr { font-size: 10px; color: var(--md-on-surface-variant); width: 24px; flex-shrink: 0; }
  .book-item .book-name { flex: 1; min-width: 0; word-break: break-word; line-height: 1.25; }


  /* ========== READER ========== */
  #reader-area { flex: 1; overflow-y: auto; background: var(--reader-bg); scroll-behavior: smooth; position: relative; }
  #reader-area::-webkit-scrollbar { width: 6px; }
  #reader-area::-webkit-scrollbar-track { background: transparent; }
  #reader-area::-webkit-scrollbar-thumb { background: var(--md-outline); border-radius: 3px; }
  .reader-controls { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--md-surface); border-bottom: 1px solid rgba(0,0,0,0.08); flex-wrap: wrap; z-index: 20; position: sticky; top: 0; }
  [data-theme="dark"] .reader-controls { background: var(--md-surface); border-bottom: 1px solid #2b2930; }
  .chapter-title { font-family: 'Crimson Pro', serif; font-size: 24px; font-weight: 600; color: var(--md-on-surface); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chapter-nav-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--md-outline); background: var(--md-surface); color: var(--md-on-surface); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .chapter-nav-btn:hover { background: var(--md-primary); color: #fff; border-color: var(--md-primary); }
  .reader-content { max-width: 720px; margin: 0 auto; padding: 24px 20px 120px; font-family: var(--font-reader); font-size: var(--font-size-reader); line-height: var(--line-height-reader); letter-spacing: var(--letter-spacing-reader); color: var(--reader-text); }
  .verse-row { display: flex; gap: 6px; margin-bottom: 2px; padding: 4px 6px; border-radius: 6px; cursor: pointer; transition: background 0.15s; position: relative; }
  .verse-row:hover { background: rgba(0,0,0,0.04); }
  [data-theme="dark"] .verse-row:hover { background: rgba(255,255,255,0.04); }
  .verse-row.selected { background: rgba(26,35,126,0.1); }
  .verse-num { font-size: 11px; font-weight: 700; color: var(--reader-verse-num); min-width: 22px; padding-top: 4px; line-height: 1; flex-shrink: 0; font-family: var(--font-ui); }
  .verse-text { flex: 1; }
  .highlight-y { background: var(--reader-highlight-y) !important; border-radius: 3px; }
  .highlight-g { background: var(--reader-highlight-g) !important; border-radius: 3px; }
  .highlight-b { background: var(--reader-highlight-b) !important; border-radius: 3px; }
  .highlight-p { background: var(--reader-highlight-p) !important; border-radius: 3px; }
  .highlight-r { background: var(--reader-highlight-r) !important; border-radius: 3px; }
  .verse-note-dot { width: 8px; height: 8px; background: var(--md-secondary); border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
  .chapter-heading { font-family: 'Crimson Pro', serif; font-size: 28px; font-weight: 600; color: var(--md-on-surface); margin: 32px 0 16px; text-align: center; }
  .section-heading { font-family: var(--font-ui); font-size: 12px; font-weight: 700; color: var(--reader-verse-num); text-transform: uppercase; letter-spacing: 1.5px; margin: 20px 0 8px; }

  /* ========== CONTEXT MENU (bottom sheet toolbar, sits above bottom-nav) ========== */
  .context-menu { position: fixed; left: 0; right: 0; bottom: 64px; background: var(--md-surface); box-shadow: 0 -4px 24px rgba(0,0,0,0.2); z-index: 1000; border-top: 1px solid var(--md-outline); overflow: hidden; animation: sheetUp 0.22s cubic-bezier(0.4,0,0.2,1); }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @media (min-width: 768px) {
    .context-menu { bottom: 0; }
  }
  .context-row { display: flex; align-items: center; gap: 8px; height: 64px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
  .context-row::-webkit-scrollbar { display: none; }
  .context-divider { width: 1px; height: 28px; background: var(--md-outline); flex-shrink: 0; margin: 0 4px; }
  .color-chip { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; transition: transform 0.15s; border: 2px solid transparent; flex-shrink: 0; }
  .color-chip:hover { transform: scale(1.18); }
  .color-chip.y { background: #fdd835; } .color-chip.g { background: #4caf50; } .color-chip.b { background: #2196f3; } .color-chip.p { background: #9c27b0; } .color-chip.r { background: #f44336; } .color-chip.x { background: var(--md-surface-variant); border: 1px solid var(--md-outline); }
  .context-icon-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; color: var(--md-on-surface-variant); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
  .context-icon-btn:hover { background: var(--md-surface-variant); }
  .context-icon-btn .material-icons-round { font-size: 22px; }

  /* ========== CHAPTER PICKER ========== */
  .chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; padding: 16px; }
  .ch-btn { height: 44px; border-radius: 8px; border: 1px solid var(--md-outline); background: var(--md-surface); color: var(--md-on-surface); cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .ch-btn:hover { background: var(--md-primary); color: #fff; border-color: var(--md-primary); }
  .ch-btn.active { background: var(--md-primary); color: #fff; border-color: var(--md-primary); }
  [data-theme="dark"] .ch-btn:hover, [data-theme="dark"] .ch-btn.active { background: var(--md-primary-light); color: #12111a; border-color: var(--md-primary-light); }

  /* ========== MODAL & SHEETS ========== */
  .modal-overlay { position: fixed; inset: 0; background: var(--md-scrim); z-index: 900; display: flex; align-items: flex-end; justify-content: center; animation: overlayIn 0.2s ease; }
  .modal-overlay.centered { align-items: center; }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  .bottom-sheet { background: var(--md-surface); border-radius: 28px 28px 0 0; width: 100%; max-height: 85vh; display: flex; flex-direction: column; animation: sheetIn 0.3s cubic-bezier(0.4,0,0.2,1); overflow: hidden; }
  /* Commentary & Context modal specifically: keeps a consistent height across
     its 3 tabs, since some (like Context) render noticeably less content
     than others (Commentary, Cross-Refs) and would otherwise make the whole
     sheet visibly shrink when switched to. */
  .commentary-sheet { height: 65vh; max-height: 65vh; }
  .commentary-sheet .sheet-body { flex: 1; min-height: 0; }
  @keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .dialog-card { background: var(--md-surface); border-radius: 20px; width: calc(100% - 32px); max-width: 480px; max-height: 80vh; display: flex; flex-direction: column; animation: dialogIn 0.25s ease; overflow: hidden; }
  @keyframes dialogIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sheet-handle { width: 40px; height: 4px; background: var(--md-outline); border-radius: 2px; margin: 12px auto 4px; flex-shrink: 0; }
  .sheet-title { font-size: 18px; font-weight: 600; padding: 12px 20px 8px; color: var(--md-on-surface); }
  .sheet-body { flex: 1; overflow-y: auto; padding: 4px 0 20px; }
  .sheet-body::-webkit-scrollbar { width: 4px; }
  .sheet-body::-webkit-scrollbar-thumb { background: var(--md-outline); border-radius: 2px; }

  /* ========== FAB ========== */
  .fab { position: fixed; bottom: 80px; right: 16px; width: 56px; height: 56px; border-radius: 16px; background: var(--md-secondary); color: #1a0000; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 200; transition: all 0.2s; }
  .fab:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
  .fab-ext { position: fixed; bottom: 80px; right: 16px; height: 56px; border-radius: 16px; background: var(--md-secondary); color: #1a0000; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0 20px 0 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 200; transition: all 0.2s; font-weight: 600; font-size: 15px; }
  .fab-ext:hover { transform: translateY(-2px); }

  /* ========== TABS ========== */
  .tab-bar { display: flex; overflow-x: auto; border-bottom: 1px solid var(--md-outline); background: var(--md-surface); -ms-overflow-style: none; scrollbar-width: none; }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-item { display: flex; align-items: center; gap: 6px; padding: 0 16px; height: 48px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--md-on-surface-variant); white-space: nowrap; border-bottom: 2px solid transparent; transition: all 0.2s; flex-shrink: 0; }
  .tab-item.active { color: var(--md-primary); border-bottom-color: var(--md-primary); }
  [data-theme="dark"] .tab-item.active { color: var(--md-primary-light); border-bottom-color: var(--md-primary-light); }
  .tab-item .material-icons-round { font-size: 18px; }

  /* ========== GENEALOGY TREE ========== */
  #genealogy-canvas-wrapper { width: 100%; height: 100%; overflow: auto; position: relative; }
  .gen-tree { position: relative; padding: 20px; }
  .gen-era { margin-bottom: 32px; }
  .gen-era-title { font-family: var(--font-ui); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--md-secondary); margin-bottom: 4px; padding: 4px 0; border-bottom: 1px dashed var(--md-outline); }
  /* Vertical lineage: a connecting line down the left with a dot per
     person and a small down-chevron between generations, instead of a
     horizontal row of "→" arrows. */
  .gen-lineage { position: relative; padding-left: 40px; }
  .gen-lineage::before { content: ''; position: absolute; left: 19px; top: 8px; bottom: 8px; width: 2px; background: var(--md-outline); }
  .gen-node { position: relative; display: flex; align-items: center; gap: 4px; padding: 9px 10px; border-radius: 10px; cursor: pointer; transition: background 0.15s; }
  .gen-node:hover { background: rgba(0,0,0,0.05); }
  [data-theme="dark"] .gen-node:hover { background: rgba(255,255,255,0.06); }
  .gen-node::before { content: ''; position: absolute; left: -27px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--md-primary); border: 3px solid var(--md-surface); z-index: 1; }
  [data-theme="dark"] .gen-node::before { background: var(--md-primary-light); }
  .gen-node .gn-body { flex: 1; min-width: 0; }
  .gen-node .gn-name { font-size: 14px; font-weight: 600; color: var(--md-on-surface); }
  .gen-node .gn-age { font-size: 11px; color: var(--md-on-surface-variant); margin-top: 2px; }
  .gen-node .material-icons-round.gn-chevron { font-size: 18px; color: var(--md-on-surface-variant); flex-shrink: 0; }
  .gen-connector { position: relative; height: 22px; }
  .gen-connector .material-icons-round { position: absolute; left: 12px; top: 3px; font-size: 16px; line-height: 1; color: var(--md-on-surface-variant); background: var(--md-surface); z-index: 1; }

  /* ========== MAPS ========== */
  .map-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #leaflet-map { width: 100%; height: 100%; background: #e8e6e0; }
  .map-controls { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 500; }
  .map-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--md-surface); border: 1px solid var(--md-outline); color: var(--md-on-surface); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px var(--md-shadow); transition: all 0.15s; }
  .map-btn:hover { background: var(--md-primary); color: #fff; }
  .map-legend { position: absolute; bottom: 12px; left: 12px; background: var(--md-surface); border-radius: 12px; padding: 10px 14px; box-shadow: 0 2px 8px var(--md-shadow); border: 1px solid var(--md-outline); font-size: 12px; max-width: 200px; max-height: 45%; overflow-y: auto; z-index: 500; }
  .map-legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; color: var(--md-on-surface); }
  .map-legend-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; }
  .map-intro { position: absolute; top: 12px; left: 12px; right: 60px; background: var(--md-surface); border-radius: 12px; padding: 10px 14px; box-shadow: 0 2px 8px var(--md-shadow); border: 1px solid var(--md-outline); font-size: 12px; color: var(--md-on-surface); line-height: 1.5; max-width: 360px; z-index: 500; }
  .map-intro b { color: var(--md-primary); font-size: 13px; }
  [data-theme="dark"] .map-intro b { color: var(--md-primary-light); }
  .map-tab-bar { display: flex; overflow-x: auto; gap: 6px; padding: 8px 12px; background: var(--md-surface); border-bottom: 1px solid var(--md-outline); -ms-overflow-style: none; scrollbar-width: none; }
  .map-tab-bar::-webkit-scrollbar { display: none; }

  /* ========== CARDS & PANELS ========== */
  .info-card { background: var(--md-surface); border: 1px solid var(--md-outline); border-radius: 16px; padding: 16px; margin: 8px 12px; }

  /* ========== NOTES ========== */

  /* ========== SETTINGS PANEL ========== */
  .settings-section { padding: 12px 16px; border-bottom: 1px solid var(--md-outline); }

  select.md-select { background: var(--md-surface-variant); border: 1px solid var(--md-outline); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--md-on-surface); outline: none; cursor: pointer; }

  /* ========== LOADING ========== */
  .loading-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #0d47a1 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; gap: 16px; color: #fff; }
  .loading-cross { font-size: 64px; animation: pulse 2s ease infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }
  .loading-title { font-family: 'Crimson Pro', serif; font-size: 32px; font-weight: 600; letter-spacing: 1px; }

  /* NOTE: menu-toggle-sidebar intentionally stays visible at all widths now —

  /* ========== SWIPE TRANSITION ========== */

  /* ========== TIMELINE ========== */
  .timeline { padding: 16px; position: relative; }

  .search-result-item { padding: 12px 16px; border-bottom: 1px solid var(--md-outline); cursor: pointer; transition: background 0.15s; }

<body>

<!-- LOADING SCREEN -->
<div class="loading-screen" id="loading-screen">
  <div class="loading-cross">✟</div>
  <div class="loading-title">Scripture</div>
  <div class="loading-subtitle" id="loading-msg">Initializing Bible Database...</div>
  <div class="loading-bar"><div class="loading-progress" id="loading-bar" style="width:0%"></div></div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast-container"></div>

<!-- CONTEXT MENU -->
<div id="context-menu" class="context-menu hidden">
  <div class="context-row">
    <div class="color-chip y" onclick="applyHighlight('y')" title="Yellow" aria-label="Highlight yellow"></div>
    <div class="color-chip g" onclick="applyHighlight('g')" title="Green" aria-label="Highlight green"></div>
    <div class="color-chip b" onclick="applyHighlight('b')" title="Blue" aria-label="Highlight blue"></div>
    <div class="color-chip p" onclick="applyHighlight('p')" title="Purple" aria-label="Highlight purple"></div>
    <div class="color-chip r" onclick="applyHighlight('r')" title="Red" aria-label="Highlight red"></div>
    <div class="color-chip x" onclick="applyHighlight(null)" title="Remove highlight" aria-label="Remove highlight"></div>
    <div class="context-divider"></div>
    <button class="context-icon-btn" onclick="bookmarkVerse()" title="Add Bookmark" aria-label="Add Bookmark"><span class="material-icons-round">bookmark_add</span></button>
    <button class="context-icon-btn" onclick="openNoteEditor()" title="Add Note" aria-label="Add Note"><span class="material-icons-round">edit_note</span></button>
    <button class="context-icon-btn" onclick="copyVerse()" title="Copy Verse" aria-label="Copy Verse"><span class="material-icons-round">content_copy</span></button>
    <button class="context-icon-btn" onclick="shareVerse()" title="Share" aria-label="Share"><span class="material-icons-round">share</span></button>
    <div class="context-divider"></div>
    <button class="context-icon-btn" onclick="closeContextMenu()" title="Close" aria-label="Close"><span class="material-icons-round">close</span></button>
  </div>
</div>

<!-- MODALS CONTAINER -->
<div id="modals"></div>

<!-- MAIN APP -->
<div id="app">
  <!-- TOP BAR -->
  <div id="top-bar">
    <button class="icon-btn menu-toggle-sidebar" onclick="toggleSidebar()" aria-label="Menu">
      <span class="material-icons-round">menu</span>
    </button>
    <div class="logo">✟ Scripture</div>
    <div class="spacer"></div>
    <button class="icon-btn" onclick="openSearchModal()" aria-label="Search">
      <span class="material-icons-round">search</span>
    </button>
    <button class="icon-btn" onclick="openCommentaryPanel()" aria-label="Commentary" id="commentary-toggle">
      <span class="material-icons-round">chrome_reader_mode</span>
    </button>
    <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme" id="theme-btn">
      <span class="material-icons-round">dark_mode</span>
    </button>
    <button class="icon-btn" onclick="openSettings()" aria-label="Settings">
      <span class="material-icons-round">settings</span>
    </button>
  </div>

  <!-- MAIN LAYOUT -->
  <div id="main-layout">
    <!-- Backdrop shown behind the sidebar overlay; tap to close -->
    <div id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>
    <!-- LEFT SIDEBAR: Book Navigator -->
    <div id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <span class="material-icons-round" style="font-size:16px;color:var(--md-secondary)">menu_book</span>
          Books of the Bible

        <div class="sidebar-search">
          <div class="search-field">
            <span class="material-icons-round">search</span>
            <input type="text" placeholder="Filter books..." id="book-filter" oninput="filterBooks(this.value)"/>

        </div>
        <div class="book-list" id="book-list"></div>
      </div>
    </div>

    <!-- CONTENT AREA -->
    <div id="content-area">

      <div id="view-reader" class="flex-col flex-1 overflow-hidden">

        <div class="reader-controls">

            <span class="material-icons-round">chevron_left</span>
          </button>
          <div style="flex:1;min-width:0;">
            <div class="chapter-title" id="chapter-display" onclick="openChapterPicker()">Genesis 1</div>
            <div style="font-size:11px;color:var(--md-on-surface-variant);margin-top:1px;">ESV · Click to navigate</div>
          </div>
          <button class="chapter-nav-btn" onclick="navigateChapter(1)" aria-label="Next chapter">
            <span class="material-icons-round">chevron_right</span>
          </button>
          <button class="chapter-nav-btn" onclick="toggleBookmark()" id="bookmark-btn" aria-label="Bookmark">
            <span class="material-icons-round">bookmark_border</span>
          </button>
        </div>
        <!-- Reader Content -->
        <div id="reader-area">
          <div class="reader-content" id="verse-container"></div>
        </div>
      </div>

      <div id="view-genealogy" class="flex-col flex-1 overflow-hidden hidden">
        <div class="tab-bar" id="genealogy-tabs">
          <div class="tab-item active" onclick="switchGenealogyTab('tree',this)"><span class="material-icons-round">account_tree</span>Family Tree</div>
          <div class="tab-item" onclick="switchGenealogyTab('characters',this)"><span class="material-icons-round">people</span>Characters</div>
          <div class="tab-item" onclick="switchGenealogyTab('timeline',this)"><span class="material-icons-round">timeline</span>Timeline</div>
          <div class="tab-item" onclick="switchGenealogyTab('ages',this)"><span class="material-icons-round">hourglass_top</span>Ages</div>
        </div>
        <div id="genealogy-content" class="flex-1 overflow-hidden"></div>
      </div>

      <div id="view-maps" class="flex-col flex-1 overflow-hidden hidden">
        <div class="map-tab-bar" id="map-tabs"></div>
        <div id="map-content" class="flex-1 overflow-hidden" style="position:relative;"></div>
      </div>

      <div id="view-ai" class="flex-col flex-1 overflow-hidden hidden" style="background:var(--md-surface-variant);">
        <div style="padding:12px 16px;background:var(--md-surface);border-bottom:1px solid var(--md-outline);display:flex;align-items:center;gap:10px;">
          <span style="font-size:28px;">🤖</span>
          <div>
            <div style="font-size:15px;font-weight:700;color:var(--md-on-surface);">AI Bible Scholar</div>
            <div style="font-size:12px;color:var(--md-on-surface-variant);">Powered by OpenAI / Gemini</div>
          </div>
          <div class="spacer"></div>
          <button class="icon-btn" onclick="openAISettings()" style="color:var(--md-on-surface-variant);">
            <span class="material-icons-round">api</span>
          </button>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-row">
          <textarea class="chat-input" id="chat-input" placeholder="Ask about theology, history, cross-references..." rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"
            oninput="autoResizeTextarea(this)"></textarea>
          <button class="chat-send-btn" onclick="sendChat()" id="chat-send">
            <span class="material-icons-round">send</span>
          </button>
        </div>
      </div>

      <div id="view-notes" class="flex-col flex-1 overflow-hidden hidden">

// ============================================================
// BIBLE DATA ENGINE
// ============================================================
  
// ESV text is fetched through a Cloudflare Worker proxy (see worker.js),
// which holds the real ESV API key server-side and avoids the browser CORS
// block on api.esv.org. Update this URL after you deploy the Worker —
// Cloudflare gives you a URL like https://esv-passage-proxy.<your-subdomain>.workers.dev
const ESV_PROXY_BASE = 'https://esv-passage-proxy.sermonnotes-dan.workers.dev';

async function fetchESVPassage(reference) {
  const params = new URLSearchParams({ q: reference });

  const resp = await fetch(`${ESV_PROXY_BASE}?${params}`);

  if (!resp.ok) {
    throw new Error(`ESV proxy request failed: ${resp.status}`);
  }

  const data = await resp.json();
  return data.passages?.[0] || '';
}

// Splits ESV API text (verse numbers embedded like "[1] In the beginning...")
// into {verseNumber: text}
function parseESVChapterText(text) {
  const verses = {};
  const regex = /\[(\d+)\]\s*/g;
  const markers = [];
  let match;
  while ((match = regex.exec(text)) !== null) {
    markers.push({ verse: parseInt(match[1], 10), textStart: regex.lastIndex });
  }
  for (let i = 0; i < markers.length; i++) {
    const start = markers[i].textStart;
    const end = i + 1 < markers.length ? markers[i + 1].textStart - `[${markers[i + 1].verse}] `.length : text.length;
    verses[markers[i].verse] = text.slice(start, end).replace(/\s+/g, ' ').trim();
  }
  return verses;
}

// Fetches every chapter of a book from the ESV API and assembles our
// {chapter: {verse: text}} format
async function fetchESVBook(bookMeta) {
  const converted = {};
  for (let c = 1; c <= bookMeta.chapters; c++) {
    const raw = await fetchESVPassage(`${bookMeta.name} ${c}`);
    const verses = parseESVChapterText(raw);
    if (Object.keys(verses).length === 0) {
      throw new Error(`ESV API returned no verses for ${bookMeta.name} ${c}`);
    }
    converted[c] = verses;
  }
  return converted;
}

// Commentary data
const COMMENTARIES = {
  'gen_1_1':{text:"The opening statement of Scripture is the most profound declaration ever made: 'In the beginning, God.' Before time, space, or matter existed, God was. The Hebrew 'Bereshit' (בְּרֵאשִׁית) indicates the absolute beginning of created reality. 'Created' (bara, בָּרָא) is used exclusively of divine action — only God creates ex nihilo (out of nothing). This verse demolishes materialism (matter is not eternal), pantheism (God is separate from creation), and polytheism (there is one Creator)."},
  'gen_1_3':{text:"'Let there be light' — God creates by his powerful word alone, a pattern repeated eight times in Chapter 1. This anticipates John 1:1-3, where the pre-incarnate Word (Logos) is the agent of all creation. Light (Hebrew: 'or) is not solar light (the sun appears on Day 4) but the foundational luminous energy that makes visible perception possible."},
  'gen_1_26':{text:"The plural 'Let us make' has been debated throughout church history. It reflects either the divine council (angels), a 'royal we,' or — most significantly — the earliest hint of the Trinity in Scripture. 'Image of God' (imago Dei) grants human beings unique dignity: rationality, moral capacity, relational nature, and dominion stewardship. No other creature bears this distinction."},
  'jhn_3_16':{text:"Often called 'the gospel in miniature,' John 3:16 encapsulates the entire Christian message in one sentence. 'God so loved' — the scope of divine love is cosmic and universal, not limited to Israel. 'The world' (Greek: kosmos) — the fallen, rebellious human race, not merely the elect. 'Only Son' (Greek: monogenes) — uniquely begotten, of the same divine essence. 'Perish' — eternal separation from God. 'Eternal life' — begins now through union with Christ and extends beyond death. This verse flows from the Nicodemus conversation, where Jesus describes new birth (3:3-8) as the prerequisite to receiving this gift."},
  'jhn_14_6':{text:"Jesus's most exclusive claim: 'I am the way, and the truth, and the life.' The definite articles ('the') make this absolute rather than relative. This is the sixth of the seven 'I AM' declarations in John's Gospel, echoing God's self-revelation in Exodus 3:14. The context is the Upper Room Discourse — Jesus comforting disciples before his crucifixion. This claim excludes religious pluralism while offering universal access: the 'way' is a person, not a system."},
  'psa_23_1':{text:"Perhaps the most beloved passage in all Scripture. David, himself a shepherd boy who became Israel's greatest king, employs the metaphor masterfully. 'The LORD' — the covenant name YHWH (Yahweh), the ever-present, self-existent God. 'My shepherd' — intensely personal. 'I shall not want' — comprehensive sufficiency: nothing necessary for life and godliness will be lacking. The psalm traces a journey from green pastures and still waters (provision), through the valley of the shadow of death (suffering), to the table set against enemies (victory), ending in God's house (eternal dwelling)."},
  'rom_8_28':{text:"One of the most comforting promises in Scripture, but often misunderstood. 'All things' does not mean all things are good, but that God is sovereignly working through all things — including suffering, loss, and pain — toward a good ultimate purpose. 'For those who love God' — the promise is covenant-conditioned, for believers. 'Called according to his purpose' — this connects to God's electing, predestining love (vv. 29-30). The 'good' is conformity to Christ's image (v. 29), not merely temporal happiness."},
  'mat_5_3':{text:"The Beatitudes open the Sermon on the Mount — Jesus's inaugural address of the Kingdom of Heaven. 'Blessed' (Greek: makarios, Hebrew: ashrei) means 'deeply happy, spiritually flourishing.' 'Poor in spirit' does not mean materially poor, but those who recognize their spiritual bankruptcy before God — the beginning of true discipleship. This is the exact opposite of the world's value system, which exalts the self-sufficient."},
  'php_4_13':{text:"One of the most frequently quoted — and most frequently misquoted — verses in the NT. In context, Paul is speaking of contentment in all circumstances, not general athletic or worldly achievement. 'I can do all things' means 'I can endure all circumstances (prosperity or poverty).' 'Through him who strengthens me' — the source is Christ, not human willpower. The text is about theological contentment rooted in union with Christ, not a blank check for personal ambition."},
  'isa_53_5':{text:"The crown jewel of the 'Servant Songs' (Isaiah 42, 49, 50, 52-53), this verse is perhaps the clearest Old Testament prophecy of substitutionary atonement. Written 700 years before the crucifixion: 'pierced for our transgressions' — his wounds were caused by our sins. 'Crushed for our iniquities' — the punishment was transferred. 'Chastisement that brought us peace' — his punishment purchases our shalom. 'By his wounds we are healed' — spiritual healing/reconciliation. The NT applies this directly to Jesus (1 Peter 2:24; Luke 22:37)."}

// ============================================================
// INDEXEDDB ENGINE
// ============================================================
let db;
function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('ScriptureDB', 2);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('bibleText')) database.createObjectStore('bibleText', {keyPath:'id'});
      if (!database.objectStoreNames.contains('highlights')) database.createObjectStore('highlights', {keyPath:'id'});
      if (!database.objectStoreNames.contains('notes')) database.createObjectStore('notes', {keyPath:'id'});
      if (!database.objectStoreNames.contains('bookmarks')) database.createObjectStore('bookmarks', {keyPath:'id'});
      if (!database.objectStoreNames.contains('settings')) database.createObjectStore('settings', {keyPath:'id'});
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}

function dbGet(storeName, key) {
  return new Promise((resolve) => {
    if (!db) { resolve(null); return; }
    try {
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch(e) { resolve(null); }
  });
}

function dbPut(storeName, data) {
  return new Promise((resolve) => {
    if (!db) { resolve(); return; }
    try {
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(data);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch(e) { resolve(); }
  });
}

async function fetchAndCacheBook(bookId) {
  // Try IndexedDB cache first (fastest — local disk, no network)
  const cached = await dbGet('bibleText', bookId);
  if (cached && cached.data) {
    APP_STATE.bibleData[bookId] = cached.data;
    return cached.data;
  }

  const bookMeta = BIBLE_BOOKS.find(b => b.id === bookId);
  if (!bookMeta) return null;

  // Try Firestore next — shared cache across devices/sessions, so if
  // anyone has ever loaded this book before, everyone gets it instantly
  // instead of re-fetching chapter-by-chapter from the ESV API.
  try {
    const fromCloud = await loadBookFromFirestore(bookId);
    if (fromCloud) {
      APP_STATE.bibleData[bookId] = fromCloud;
      await dbPut('bibleText', {id: bookId, data: fromCloud, fetched: Date.now()});
      return fromCloud;
    }
  } catch(e) {
    console.warn(`Firestore cache lookup failed for ${bookMeta.name}:`, e);
  }

  // Try ESV API first
  try {
    const converted = await fetchESVBook(bookMeta);
    APP_STATE.bibleData[bookId] = converted;
    await dbPut('bibleText', {id: bookId, data: converted, fetched: Date.now()});
    saveBookToFirestore(bookId, converted); // fire-and-forget, don't block the reader
    return converted;
  } catch(e) {
    console.warn(`ESV API fetch failed for ${bookMeta.name}, falling back to KJV:`, e);
  }

  // Map internal IDs to KJV JSON repo naming
  const nameMap = {gen:'genesis',exo:'exodus',lev:'leviticus',num:'numbers',deu:'deuteronomy',jos:'joshua',jdg:'judges',rut:'ruth','1sa':'1samuel','2sa':'2samuel','1ki':'1kings','2ki':'2kings','1ch':'1chronicles','2ch':'2chronicles',ezr:'ezra',neh:'nehemiah',est:'esther',job:'job',psa:'psalms',pro:'proverbs',ecc:'ecclesiastes',sng:'songofsolomon',isa:'isaiah',jer:'jeremiah',lam:'lamentations',ezk:'ezekiel',dan:'daniel',hos:'hosea',jol:'joel',amo:'amos',oba:'obadiah',jon:'jonah',mic:'micah',nam:'nahum',hab:'habakkuk',zep:'zephaniah',hag:'haggai',zec:'zechariah',mal:'malachi',mat:'matthew',mrk:'mark',luk:'luke',jhn:'john',act:'acts',rom:'romans','1co':'1corinthians','2co':'2corinthians',gal:'galatians',eph:'ephesians',php:'philippians',col:'colossians','1th':'1thessalonians','2th':'2thessalonians','1ti':'1timothy','2ti':'2timothy',tit:'titus',phm:'philemon',heb:'hebrews',jas:'james','1pe':'1peter','2pe':'2peter','1jn':'1john','2jn':'2john','3jn':'3john',jud:'jude',rev:'revelation'};

  const urlName = nameMap[bookId] || bookId;
  try {
    const resp = await fetch(`https://raw.githubusercontent.com/aruljohn/Bible-kjv/master/${urlName}.json`, {signal: AbortSignal.timeout(8000)});
    if (resp.ok) {
      const kjvData = await resp.json();
      // Convert KJV JSON format to our format
      const converted = {};
      if (kjvData.chapters) {
        kjvData.chapters.forEach((ch, ci) => {
          converted[ci+1] = {};
          ch.verses.forEach((v, vi) => {
            converted[ci+1][vi+1] = v.text;
          });
        });
      }
      APP_STATE.bibleData[bookId] = converted;
      await dbPut('bibleText', {id: bookId, data: converted, fetched: Date.now()});
      return converted;
    }
  } catch(e) {
    // Network unavailable or CORS — use seed data
  }
  return APP_STATE.bibleData[bookId] || generatePlaceholderChapters(bookMeta);
}

function generatePlaceholderChapters(bookMeta) {
  const data = {};
  for (let c = 1; c <= bookMeta.chapters; c++) {
    data[c] = {};
    // Generate placeholder verses
    for (let v = 1; v <= 10; v++) {
      data[c][v] = `[${bookMeta.name} ${c}:${v} — Connect to internet to load full text, or use the seed data included for key passages.]`;
    }
  }
  return data;
}

async function initApp() {
  updateLoadingBar(10, "Opening database...");
  await initDB();

  // Kick off Firebase SDK load early (non-blocking) so Firestore is likely
  // ready by the time fetchAndCacheBook needs it below.
  initFirebase();

  updateLoadingBar(25, "Loading settings...");
  await loadSettings();

  updateLoadingBar(40, "Building book navigator...");
  buildBookList();

  updateLoadingBar(60, "Loading Bible text...");
  await fetchAndCacheBook(APP_STATE.currentBook);

  updateLoadingBar(80, "Rendering reader...");
  renderChapter();
  updateChapterDisplay();
  renderRightPanel();
  renderNotesTab();

  updateLoadingBar(90, "Building maps & genealogy...");
  buildMaps();
  renderGenealogyTab();

  updateLoadingBar(100, "Ready!");
  await new Promise(r => setTimeout(r, 400));

  document.getElementById('loading-screen').style.opacity = '0';
  document.getElementById('loading-screen').style.transition = 'opacity 0.4s';
  setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 400);

  // Init AI chat
  initAIChat();

  // Sidebar is now an overlay drawer (see below), so it stays closed by
  // default at every width — auto-opening it would dim the reading area
  // behind a backdrop on load, which isn't what we want. Commentary &
  // Context is now a modal too, so it likewise stays closed until the
  // user taps the commentary icon.

  // Touch swipe support
  setupSwipeGestures();

  // Save state periodically
  setInterval(saveSettings, 30000);
}

function updateLoadingBar(pct, msg) {
  document.getElementById('loading-bar').style.width = pct + '%';
  document.getElementById('loading-msg').textContent = msg;
}

async function loadSettings() {
  const settings = await dbGet('settings', 'main');
  if (settings) {
    APP_STATE.darkMode = settings.darkMode || false;
    APP_STATE.fontSize = settings.fontSize || 17;
    APP_STATE.fontFamily = settings.fontFamily || 'serif';
    APP_STATE.lineHeight = settings.lineHeight || 1.85;
    APP_STATE.currentBook = settings.currentBook || 'gen';
    APP_STATE.currentChapter = settings.currentChapter || 1;
  }
  applyTheme();
  applyReaderSettings();
}

async function saveSettings() {
  await dbPut('settings', {
    id: 'main',
    darkMode: APP_STATE.darkMode,
    fontSize: APP_STATE.fontSize,
    fontFamily: APP_STATE.fontFamily,
    lineHeight: APP_STATE.lineHeight,
    currentBook: APP_STATE.currentBook,
    currentChapter: APP_STATE.currentChapter,
  });
}

// BOOK LIST
// ============================================================
function buildBookList() {
  const container = document.getElementById('book-list');
  const OT = BIBLE_BOOKS.filter(b => b.testament === 'OT');
  const NT = BIBLE_BOOKS.filter(b => b.testament === 'NT');

  const renderBook = (book) => {
    const isActive = book.id === APP_STATE.currentBook;
    return `<div class="book-group" data-book="${book.id}">
      <div class="book-item${isActive ? ' active' : ''}" data-book="${book.id}" onclick="selectBook('${book.id}')">
        <span class="book-abbr">${book.abbr}</span>
        <span class="book-name">${book.name}</span>
      </div>
    </div>`;
  };

  let otHtml = '<div class="testament-label">Old Testament</div>';
  OT.forEach(book => otHtml += renderBook(book));
  let ntHtml = '<div class="testament-label">New Testament</div>';
  NT.forEach(book => ntHtml += renderBook(book));

  container.innerHTML = `<div class="testament-columns">
    <div class="testament-col">${otHtml}</div>
    <div class="testament-col">${ntHtml}</div>
  </div>`;
}

function filterBooks(query) {
  const groups = document.querySelectorAll('.book-group');
  const q = query.toLowerCase();
  groups.forEach(group => {
    const item = group.querySelector('.book-item');
    const name = item.textContent.toLowerCase();
    group.style.display = name.includes(q) ? '' : 'none';
  });
}

// Clicking a book loads chapter 1 immediately and closes the sidebar
// right away (any screen size) — no intermediate chapter picker step.
async function selectBook(bookId) {
  APP_STATE.currentBook = bookId;
  APP_STATE.currentChapter = 1;
  buildBookList();
  showToast(`Loading ${BIBLE_BOOKS.find(b => b.id === bookId).name}...`);

  // Picking a book should always jump to the Reader — otherwise the
  // book loads silently behind whatever tab (Genealogy, Notes, etc.)
  // the user happened to be on.
  switchTab('reader', document.getElementById('nav-reader'));

  await fetchAndCacheBook(bookId);

  updateChapterDisplay();
  renderChapter();
  renderRightPanel();
  updateBookmarkBtn();

  toggleSidebar(false);
}

// ============================================================
// READER
// ============================================================
function renderChapter() {
  const container = document.getElementById('verse-container');
  const bookId = APP_STATE.currentBook;
  const chap = APP_STATE.currentChapter;
  const bookData = APP_STATE.bibleData[bookId];
  const bookMeta = BIBLE_BOOKS.find(b => b.id === bookId);

  if (!bookData || !bookData[chap]) {
    container.innerHTML = `<div class="empty-state"><span class="material-icons-round">hourglass_top</span><p>Loading ${bookMeta.name} ${chap}...<br>Connect to internet for full text.</p></div>`;
    fetchAndCacheBook(bookId).then(() => renderChapter());
    return;
  }

  const verses = bookData[chap];
  let html = `<div class="chapter-heading">${bookMeta.name} ${chap}</div>`;

  const verseNums = Object.keys(verses).map(Number).sort((a, b) => a - b);
  verseNums.forEach(vNum => {
    const key = `${bookId}_${chap}_${vNum}`;
    const highlight = APP_STATE.highlights[key];
    const hasNote = !!APP_STATE.notes[key];
    html += `<div class="verse-row${highlight ? ' highlight-'+highlight : ''}" 
      id="verse-${vNum}"
      data-key="${key}"
      data-verse="${vNum}"
      onclick="selectVerse('${key}', ${vNum}, event)"
      oncontextmenu="selectVerse('${key}', ${vNum}, event, true)">
      <span class="verse-num">${vNum}</span>
      <span class="verse-text">${escapeHTML(verses[vNum])}</span>
      ${hasNote ? '<span class="verse-note-dot" title="Has note"></span>' : ''}
    </div>`;
  });

  container.innerHTML = html;
  container.classList.add('slide-in-right');
  setTimeout(() => container.classList.remove('slide-in-right'), 300);

  // Scroll to top
  document.getElementById('reader-area').scrollTop = 0;
}

function escapeHTML(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateChapterDisplay() {
  const bookMeta = BIBLE_BOOKS.find(b => b.id === APP_STATE.currentBook);
  document.getElementById('chapter-display').textContent = `${bookMeta.name} ${APP_STATE.currentChapter}`;
  document.title = `${bookMeta.name} ${APP_STATE.currentChapter} — Scripture`;
  updateBookmarkBtn();
}

async function navigateChapter(dir) {
  const bookMeta = BIBLE_BOOKS.find(b => b.id === APP_STATE.currentBook);
  let newChap = APP_STATE.currentChapter + dir;

  if (newChap < 1) {
    // Go to previous book
    const idx = BIBLE_BOOKS.findIndex(b => b.id === APP_STATE.currentBook);
    if (idx > 0) {
      APP_STATE.currentBook = BIBLE_BOOKS[idx-1].id;
      const prevMeta = BIBLE_BOOKS[idx-1];
      APP_STATE.currentChapter = prevMeta.chapters;
    } else return;
  } else if (newChap > bookMeta.chapters) {
    // Go to next book
    const idx = BIBLE_BOOKS.findIndex(b => b.id === APP_STATE.currentBook);
    if (idx < BIBLE_BOOKS.length - 1) {
      APP_STATE.currentBook = BIBLE_BOOKS[idx+1].id;
      APP_STATE.currentChapter = 1;
    } else return;
  } else {
    APP_STATE.currentChapter = newChap;
  }

  document.getElementById('verse-container').classList.add(dir > 0 ? 'slide-in-right' : 'slide-in-left');
  await fetchAndCacheBook(APP_STATE.currentBook);
  buildBookList();
  updateChapterDisplay();
  renderChapter();
  renderRightPanel();
  saveSettings();
}

// ============================================================
// CHAPTER PICKER
// ============================================================
function openChapterPicker() {
  const bookMeta = BIBLE_BOOKS.find(b => b.id === APP_STATE.currentBook);
  let chapHtml = '';
  for (let c = 1; c <= bookMeta.chapters; c++) {
    chapHtml += `<button class="ch-btn${c === APP_STATE.currentChapter ? ' active' : ''}" onclick="selectChapter(${c});">${c}</button>`;
  }

  showModal(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">${bookMeta.name} — Select Chapter</div>
    <div class="sheet-body">
      <div class="chapter-grid">${chapHtml}</div>
    </div>
  `, true);
}

function selectChapter(ch) {
  APP_STATE.currentChapter = ch;
  closeModal();
  updateChapterDisplay();
  renderChapter();
  renderRightPanel();
  saveSettings();
}

// ============================================================
// VERSE INTERACTION
// ============================================================
function selectVerse(key, verseNum, event, isContext = false) {
  if (event) {
    event.preventDefault();
    if (event.type === 'contextmenu') isContext = true;
  }

  // Deselect previous
  document.querySelectorAll('.verse-row.selected').forEach(el => el.classList.remove('selected'));

  const el = document.getElementById(`verse-${verseNum}`);
  if (el) el.classList.add('selected');

  APP_STATE.selectedVerse = verseNum;
  APP_STATE.selectedVerseKey = key;

  // Show context menu (bottom sheet — no positioning needed, it's anchored via CSS)
  showContextMenu();
}

function showContextMenu() {
  document.getElementById('context-menu').classList.remove('hidden');
}

function closeContextMenu() {
  document.getElementById('context-menu').classList.add('hidden');
  document.querySelectorAll('.verse-row.selected').forEach(el => el.classList.remove('selected'));
  APP_STATE.selectedVerseKey = null;
}

document.addEventListener('click', (e) => {
  if (!document.getElementById('context-menu').contains(e.target) &&
      !e.target.closest('.verse-row')) {
    closeContextMenu();
  }
});

function applyHighlight(color) {
  const key = APP_STATE.selectedVerseKey;
  if (!key) return;

  if (color === null) {
    delete APP_STATE.highlights[key];
  } else {
    APP_STATE.highlights[key] = color;
  }
  localStorage.setItem('bible_highlights', JSON.stringify(APP_STATE.highlights));
  dbPut('highlights', {id: 'all', data: APP_STATE.highlights});
  renderChapter();
  closeContextMenu();
  showToast(color ? 'Highlight applied' : 'Highlight removed');
}

function bookmarkVerse() {
  const key = APP_STATE.selectedVerseKey;
  if (!key) return;
  const parts = key.split('_');
  const bookMeta = BIBLE_BOOKS.find(b => b.id === parts[0]);
  const ref = `${bookMeta.name} ${parts[1]}:${parts[2]}`;
  const bookData = APP_STATE.bibleData[parts[0]];
  const preview = bookData?.[parts[1]]?.[parts[2]] || '';

  const existing = APP_STATE.bookmarks.findIndex(b => b.key === key);
  if (existing >= 0) {
    APP_STATE.bookmarks.splice(existing, 1);
    showToast('Bookmark removed');
  } else {
    APP_STATE.bookmarks.unshift({key, ref, preview: preview.substring(0,100), date: new Date().toISOString()});
    showToast('Verse bookmarked');
  }
  localStorage.setItem('bible_bookmarks', JSON.stringify(APP_STATE.bookmarks));
  dbPut('bookmarks', {id: 'all', data: APP_STATE.bookmarks});
  closeContextMenu();
  updateBookmarkBtn();
}

function toggleBookmark() {
  const key = `${APP_STATE.currentBook}_${APP_STATE.currentChapter}`;
  const bookMeta = BIBLE_BOOKS.find(b => b.id === APP_STATE.currentBook);
  const ref = `${bookMeta.name} ${APP_STATE.currentChapter}`;
  const existing = APP_STATE.bookmarks.findIndex(b => b.key === key);
  if (existing >= 0) {
    APP_STATE.bookmarks.splice(existing, 1);
    showToast('Bookmark removed');
  } else {
    APP_STATE.bookmarks.unshift({key, ref, preview: `Chapter ${APP_STATE.currentChapter}`, date: new Date().toISOString()});
    showToast('Chapter bookmarked');
  }
  localStorage.setItem('bible_bookmarks', JSON.stringify(APP_STATE.bookmarks));
  updateBookmarkBtn();
}

function updateBookmarkBtn() {
  const key = `${APP_STATE.currentBook}_${APP_STATE.currentChapter}`;
  const isBookmarked = APP_STATE.bookmarks.some(b => b.key === key);
  const btn = document.getElementById('bookmark-btn');
  if (btn) btn.querySelector('span').textContent = isBookmarked ? 'bookmark' : 'bookmark_border';
}

function openNoteEditor() {
  const key = APP_STATE.selectedVerseKey;
  if (!key) return;
  const parts = key.split('_');
  const bookMeta = BIBLE_BOOKS.find(b => b.id === parts[0]);
  const ref = `${bookMeta.name} ${parts[1]}:${parts[2]}`;
  const existing = APP_STATE.notes[key] || '';
  closeContextMenu();

  showModal(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Note — ${ref}</div>
    <div class="sheet-body" style="padding:12px 16px;">
      <textarea class="note-textarea" id="note-input" placeholder="Write your note here...">${escapeHTML(existing)}</textarea>
      <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end;">
        ${existing ? `<button onclick="deleteNote('${key}')" style="padding:10px 18px;border-radius:20px;border:1px solid var(--md-error);background:transparent;color:var(--md-error);cursor:pointer;font-weight:600;">Delete</button>` : ''}
        <button onclick="closeModal()" style="padding:10px 18px;border-radius:20px;border:1px solid var(--md-outline);background:transparent;color:var(--md-on-surface);cursor:pointer;">Cancel</button>
        <button onclick="saveNote('${key}')" style="padding:10px 20px;border-radius:20px;background:var(--md-primary);color:#fff;border:none;cursor:pointer;font-weight:600;">Save Note</button>
      </div>
    </div>
  `, true);
}

function saveNote(key) {
  const text = document.getElementById('note-input').value.trim();
  if (text) {
    APP_STATE.notes[key] = text;
    localStorage.setItem('bible_notes', JSON.stringify(APP_STATE.notes));
    dbPut('notes', {id: 'all', data: APP_STATE.notes});
    showToast('Note saved');
  }
  closeModal();
  renderChapter();
  if (APP_STATE.notesSubTab === 'notes') renderNotesTab();
}

function deleteNote(key) {
  delete APP_STATE.notes[key];
  localStorage.setItem('bible_notes', JSON.stringify(APP_STATE.notes));
  closeModal();
  renderChapter();
  showToast('Note deleted');
  if (APP_STATE.notesSubTab === 'notes') renderNotesTab();
}

function copyVerse() {
  const key = APP_STATE.selectedVerseKey;
  if (!key) return;
  const parts = key.split('_');
  const bookMeta = BIBLE_BOOKS.find(b => b.id === parts[0]);
  const text = APP_STATE.bibleData[parts[0]]?.[parts[1]]?.[parts[2]] || '';
  const ref = `${bookMeta.name} ${parts[1]}:${parts[2]} (ESV)`;
  navigator.clipboard?.writeText(`"${text}" — ${ref}`).then(() => showToast('Verse copied!')).catch(() => showToast('Copy failed'));
  closeContextMenu();
}

function shareVerse() {
  const key = APP_STATE.selectedVerseKey;
  if (!key) return;
  const parts = key.split('_');
  const bookMeta = BIBLE_BOOKS.find(b => b.id === parts[0]);
  const text = APP_STATE.bibleData[parts[0]]?.[parts[1]]?.[parts[2]] || '';
  const ref = `${bookMeta.name} ${parts[1]}:${parts[2]} (ESV)`;
  if (navigator.share) {
    navigator.share({title: ref, text: `"${text}" — ${ref}`, url: window.location.href});
  } else {
    copyVerse();
  }
  closeContextMenu();
}

// ============================================================
// RIGHT PANEL
// ============================================================
function renderRightPanel() {
  // Self-correcting: if the modal was dismissed (backdrop click, etc.)
  // the #right-panel-content element won't exist anymore even if the
  // state flag hasn't been explicitly cleared yet.
  if (!APP_STATE.rightPanelOpen || !document.getElementById('right-panel-content')) {
    APP_STATE.rightPanelOpen = false;
    return;
  }
  renderRightSubTab(APP_STATE.rightSubTab);
}

function switchRightTab(tab, el) {
  APP_STATE.rightSubTab = tab;
  document.querySelectorAll('#right-tabs .tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderRightSubTab(tab);
}

function renderRightSubTab(tab) {
  const container = document.getElementById('right-panel-content');
  const bookId = APP_STATE.currentBook;
  const chap = APP_STATE.currentChapter;
  const bookMeta = BIBLE_BOOKS.find(b => b.id === bookId);
  const ctx = BOOK_CONTEXT[bookId];

  if (tab === 'commentary') {
    // Show commentary for current chapter verses
    let html = '';
    const verseKey = APP_STATE.selectedVerseKey || `${bookId}_${chap}_1`;
    const commentary = COMMENTARIES[verseKey];
    if (commentary) {
      const parts = verseKey.split('_');
      const ref = `${bookMeta.name} ${parts[1]}:${parts[2]}`;
      html += `<div class="info-card">
        <div class="commentary-verse-ref">${ref}</div>
        <div class="commentary-text">${commentary.text}</div>
      </div>`;
    }

    // List available commentaries for this chapter
    const chapCommentaries = Object.entries(COMMENTARIES).filter(([k]) => k.startsWith(`${bookId}_${chap}_`));
    if (chapCommentaries.length > 0) {
      html += `<div style="padding:8px 16px;font-size:12px;font-weight:700;color:var(--md-on-surface-variant);text-transform:uppercase;letter-spacing:1px;">Verse Commentaries</div>`;
      chapCommentaries.forEach(([key, data]) => {
        const parts = key.split('_');
        html += `<div class="cross-ref-item" onclick="showCommentary('${key}')">
          <span class="cross-ref-badge">${bookMeta.name} ${parts[1]}:${parts[2]}</span>
          <span>${data.text.substring(0, 80)}...</span>
        </div>`;
      });
    }

    if (!html) {
      html = `<div class="empty-state"><span class="material-icons-round">library_books</span><p>Tap a verse in the reader to see commentary for it.</p></div>`;
    }
    container.innerHTML = html;

  } else if (tab === 'context') {
    if (!ctx) {
      container.innerHTML = `<div class="empty-state"><span class="material-icons-round">info</span><p>No detailed context available for ${bookMeta.name} yet.</p></div>`;
      return;
    }
    let html = `<div class="info-card">
      <div class="era-badge"><span class="material-icons-round" style="font-size:14px;">schedule</span>${ctx.setting || ''}</div>
      <div class="info-card-title">${bookMeta.name} — Book Overview</div>
      <div class="info-row"><span class="info-label">Author</span><span class="info-value">${ctx.author}</span></div>
      <div class="info-row"><span class="info-label">Date Written</span><span class="info-value">${ctx.date}</span></div>
      <div class="info-row"><span class="info-label">Audience</span><span class="info-value">${ctx.audience}</span></div>
      <div class="divider"></div>
      <div style="font-size:13px;color:var(--md-on-surface);line-height:1.6;">${ctx.summary}</div>
    </div>
    <div class="info-card">
      <div class="info-card-title">Key Themes</div>
      <div>${(ctx.themes||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
    <div class="info-card">
      <div class="info-card-title">Theological Intent</div>
      <div style="font-size:13px;color:var(--md-on-surface);line-height:1.6;">${ctx.theologicalIntent || ''}</div>
    </div>
    <div class="info-card">
      <div class="info-card-title">Key Verses</div>
      ${(ctx.keyVerses||[]).map(v => `<div class="cross-ref-item" onclick="navigateToRef('${bookId}', '${v}')"><span class="cross-ref-badge">${bookMeta.abbr} ${v}</span></div>`).join('')}
    </div>`;
    container.innerHTML = html;

  } else if (tab === 'crossrefs') {
    const verseKey = APP_STATE.selectedVerseKey || Object.keys(CROSS_REFS).find(k => k.startsWith(bookId)) || '';
    const refs = CROSS_REFS[verseKey] || [];
    const allRefs = Object.entries(CROSS_REFS).filter(([k]) => k.startsWith(bookId));

    let html = '';
    if (refs.length > 0) {
      const parts = verseKey.split('_');
      html += `<div style="padding:8px 16px;font-size:12px;font-weight:700;color:var(--md-on-surface-variant);text-transform:uppercase;">For ${bookMeta.name} ${parts[1]}:${parts[2]}</div>`;
      refs.forEach(r => {
        html += `<div class="cross-ref-item" onclick="showToast('${r}')">
          <span class="material-icons-round" style="font-size:16px;color:var(--md-secondary);flex-shrink:0;">link</span>
          <span class="cross-ref-badge">${r}</span>
        </div>`;
      });
    }

    if (allRefs.length > 0) {
      html += `<div style="padding:8px 16px;font-size:12px;font-weight:700;color:var(--md-on-surface-variant);text-transform:uppercase;margin-top:8px;">All ${bookMeta.name} Cross-Refs</div>`;
      allRefs.forEach(([key, refs]) => {
        const parts = key.split('_');
        refs.forEach(r => {
          html += `<div class="cross-ref-item">
            <span class="cross-ref-badge">${bookMeta.abbr} ${parts[1]}:${parts[2]}</span>
            <span style="color:var(--md-primary);font-weight:600;">${r}</span>
          </div>`;
        });
      });
    }

    if (!html) {
      html = `<div class="empty-state"><span class="material-icons-round">link</span><p>Tap a verse to see its cross-references.</p></div>`;
    }
    container.innerHTML = html;
  }
}

function showCommentary(key) {
  const commentary = COMMENTARIES[key];
  if (!commentary) return;
  const parts = key.split('_');
  const bookMeta = BIBLE_BOOKS.find(b => b.id === parts[0]);
  const ref = `${bookMeta.name} ${parts[1]}:${parts[2]}`;
  showModal(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Commentary — ${ref}</div>
    <div class="sheet-body" style="padding:16px;">
      <div class="commentary-verse-ref">${ref}</div>
      <div class="commentary-text" style="line-height:1.8;">${commentary.text}</div>
    </div>
  `, true);
}

// ============================================================
// NOTES & BOOKMARKS TAB
// ============================================================
function switchNotesTab(tab, el) {
  APP_STATE.notesSubTab = tab;
  document.querySelectorAll('#view-notes .tab-bar .tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderNotesTab();
}

function renderNotesTab() {
  const container = document.getElementById('notes-content');
  const tab = APP_STATE.notesSubTab;

  if (tab === 'notes') {
    const entries = Object.entries(APP_STATE.notes);
    if (entries.length === 0) {
      container.innerHTML = `<div class="empty-state"><span class="material-icons-round">note_alt</span><p>No notes yet. Long-press a verse to add a note.</p></div>`;
      return;
    }
    container.innerHTML = entries.map(([key, text]) => {
      const parts = key.split('_');
      const bookMeta = BIBLE_BOOKS.find(b => b.id === parts[0]);
      const ref = bookMeta ? `${bookMeta.name} ${parts[1]}:${parts[2]}` : key;
      return `<div class="note-card" onclick="goToVerse('${key}')">
        <div class="note-ref">${ref}</div>
        <div class="note-text">${escapeHTML(text).substring(0,200)}${text.length>200?'...':''}</div>
      </div>`;
    }).join('');

  } else if (tab === 'bookmarks') {
    if (APP_STATE.bookmarks.length === 0) {
      container.innerHTML = `<div class="empty-state"><span class="material-icons-round">bookmarks</span><p>No bookmarks yet. Tap the bookmark icon to save a chapter.</p></div>`;
      return;
    }
    container.innerHTML = APP_STATE.bookmarks.map(bm => `
      <div class="bookmark-item" onclick="goToVerse('${bm.key}')">
        <span class="material-icons-round" style="color:var(--md-secondary);flex-shrink:0;">bookmark</span>
        <div style="flex:1;min-width:0;">
          <div class="bookmark-ref">${bm.ref}</div>
          <div class="bookmark-preview">${escapeHTML(bm.preview)}</div>
        </div>
        <button onclick="event.stopPropagation();removeBookmark('${bm.key}')" style="background:none;border:none;cursor:pointer;color:var(--md-on-surface-variant);">
          <span class="material-icons-round" style="font-size:18px;">close</span>
        </button>
      </div>
    `).join('');

  } else if (tab === 'highlights') {
    const entries = Object.entries(APP_STATE.highlights);
    if (entries.length === 0) {
      container.innerHTML = `<div class="empty-state"><span class="material-icons-round">highlight</span><p>No highlights yet. Tap a verse to highlight it.</p></div>`;
      return;
    }
    const colorNames = {y:'Yellow',g:'Green',b:'Blue',p:'Purple',r:'Red'};
    const colorMap = {y:'#fdd835',g:'#4caf50',b:'#2196f3',p:'#9c27b0',r:'#f44336'};
    container.innerHTML = entries.map(([key, color]) => {
      const parts = key.split('_');
      const bookMeta = BIBLE_BOOKS.find(b => b.id === parts[0]);
      const ref = bookMeta ? `${bookMeta.name} ${parts[1]}:${parts[2]}` : key;
      const text = APP_STATE.bibleData[parts[0]]?.[parts[1]]?.[parts[2]] || '';
      return `<div class="bookmark-item" onclick="goToVerse('${key}')">
        <div style="width:16px;height:16px;border-radius:50%;background:${colorMap[color]||'#ccc'};flex-shrink:0;"></div>
        <div style="flex:1;min-width:0;">
          <div class="bookmark-ref">${ref} <span style="font-size:11px;color:var(--md-on-surface-variant);">(${colorNames[color]||''})</span></div>
          <div class="bookmark-preview">${escapeHTML(text)}</div>
        </div>
      </div>`;
    }).join('');
  }
}

function removeBookmark(key) {
  APP_STATE.bookmarks = APP_STATE.bookmarks.filter(b => b.key !== key);
  localStorage.setItem('bible_bookmarks', JSON.stringify(APP_STATE.bookmarks));
  renderNotesTab();
  showToast('Bookmark removed');
}

async function goToVerse(key) {
  const parts = key.split('_');
  if (parts.length >= 2) {
    APP_STATE.currentBook = parts[0];
    APP_STATE.currentChapter = parseInt(parts[1]) || 1;
    await fetchAndCacheBook(parts[0]);
    switchTab('reader', document.getElementById('nav-reader'));
    buildBookList();
    updateChapterDisplay();
    renderChapter();
    renderRightPanel();
    // Scroll to verse
    setTimeout(() => {
      const el = document.getElementById(`verse-${parts[2]}`);
      if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 300);
  }
}

function renderGenealogyTab() {
  switchGenealogyTab(APP_STATE.genealogySubTab, document.querySelector('#genealogy-tabs .tab-item.active'));
}

          <div style="flex:1;min-width:0;">
            <div class="char-name">${c.name}</div>
            <div class="char-desc">${c.role}</div>
            <div class="char-ref">${c.ref}</div>
          </div>
          ${c.age ? `<div style="font-size:12px;font-weight:700;color:var(--md-secondary);flex-shrink:0;">${c.age} yrs</div>` : ''}
        </div>`;
      });
    });
    html += '</div>';
    container.innerHTML = html;

  } else if (tab === 'timeline') {
    let html = '<div class="scrollable" style="height:100%;overflow-y:auto;"><div class="timeline" style="padding-left:50px;">';
    BIBLICAL_ERAS.forEach(era => {
      html += `<div class="timeline-item">
        <div style="position:absolute;left:-20px;display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div style="width:14px;height:14px;border-radius:50%;background:${era.color};border:2px solid var(--md-surface);z-index:1;"></div>
        </div>
        <div class="timeline-content">
          <div class="timeline-year">${era.years}</div>
          <div class="timeline-event" style="color:${era.color};">${era.name}</div>
          <div class="timeline-desc">${era.desc}</div>
        </div>
      </div>`;
    });
    html += '</div></div>';
    container.innerHTML = html;

  } else if (tab === 'ages') {

// Persistent Leaflet map instance — recreated once, then just updated
// (markers/route/view) on every era switch instead of rebuilding tiles.
let bibleMap = null;
let bibleMapLayers = [];

function buildMaps() {
  const tabBar = document.getElementById('map-tabs');
  tabBar.innerHTML = Object.entries(BIBLE_MAPS).map(([key, map]) =>
    `<div class="map-tab${key === APP_STATE.mapMode ? ' active' : ''}" onclick="switchMap('${key}', this)">${map.title.split('(')[0].trim()}</div>`
  ).join('');
  renderMap();
}

function switchMap(key, el) {
  APP_STATE.mapMode = key;
  document.querySelectorAll('.map-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderMap();
}

function renderMap() {
  const container = document.getElementById('map-content');
  const mapData = BIBLE_MAPS[APP_STATE.mapMode];

  // Build the shell once — Leaflet needs a stable div to attach to and
  // shouldn't be torn down/rebuilt on every era switch (that would
  // re-download all the map tiles each time).
  if (!document.getElementById('leaflet-map')) {
    container.innerHTML = `
      <div class="map-container">
        <div id="leaflet-map"></div>
        <div class="map-intro" id="map-intro"></div>
        <div class="map-controls">
          <button class="map-btn" onclick="recenterMap()" title="Recenter"><span class="material-icons-round" style="font-size:18px;">center_focus_strong</span></button>
        </div>
        <div class="map-legend" id="map-legend"></div>
      </div>`;
  }

  document.getElementById('map-intro').innerHTML = `
    <b>${mapData.title}</b>
    <div style="margin-top:4px;">${mapData.description}</div>
    <div style="margin-top:6px;font-size:11px;color:var(--md-on-surface-variant);">Numbers show the order of the journey — tap any stop for details.</div>`;

  document.getElementById('map-legend').innerHTML = `
    <div style="font-weight:700;font-size:12px;margin-bottom:6px;color:var(--md-on-surface);">Stops</div>
    ${mapData.pins.map((p, idx) => `<div class="map-legend-item" onclick="showMapPin('${p.id}')" style="cursor:pointer;"><div class="map-legend-dot" style="background:${p.color}">${idx + 1}</div>${p.name}</div>`).join('')}`;

  if (!bibleMap) {
    bibleMap = L.map('leaflet-map', { zoomControl: true, attributionControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(bibleMap);
  }

  // Clear the previous era's markers/route before drawing the new one
  bibleMapLayers.forEach(layer => bibleMap.removeLayer(layer));
  bibleMapLayers = [];

  const latlngs = mapData.pins.map(p => [p.lat, p.lng]);

  const route = L.polyline(latlngs, {
    color: '#4a4a4a', weight: 2.5, dashArray: '6,8', opacity: 0.65
  }).addTo(bibleMap);
  bibleMapLayers.push(route);

  mapData.pins.forEach((pin, idx) => {
    const icon = L.divIcon({
      className: '',
      html: `<div class="map-pin-badge" style="background:${pin.color};width:28px;height:28px;border-radius:50%;font-size:13px;">${idx + 1}</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
    });
    const marker = L.marker([pin.lat, pin.lng], {icon, title: pin.name}).addTo(bibleMap);
    marker.bindTooltip(pin.name, {direction: 'top', offset: [0, -12]});
    marker.on('click', () => showMapPin(pin.id));
    bibleMapLayers.push(marker);
  });

  bibleMap.fitBounds(route.getBounds(), {padding: [50, 50]});
  // Container may have just become visible (tab switch) — Leaflet needs
  // a nudge to recompute its size correctly once layout settles.
  setTimeout(() => { bibleMap.invalidateSize(); bibleMap.fitBounds(route.getBounds(), {padding: [50, 50]}); }, 150);
}

function recenterMap() {
  if (!bibleMap) return;
  const mapData = BIBLE_MAPS[APP_STATE.mapMode];
  const latlngs = mapData.pins.map(p => [p.lat, p.lng]);
  bibleMap.fitBounds(L.latLngBounds(latlngs), {padding: [50, 50]});
}

function showMapPin(pinId) {
  const mapData = BIBLE_MAPS[APP_STATE.mapMode];
  const pin = mapData.pins.find(p => p.id === pinId);
  if (!pin) return;

  showModal(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">📍 ${pin.name}</div>
    <div class="sheet-body" style="padding:0 16px 20px;">
      <div style="font-size:14px;color:var(--md-on-surface);line-height:1.7;margin-bottom:12px;">${pin.desc}</div>
      ${pin.verses && pin.verses.length ? `<div style="font-size:12px;font-weight:700;color:var(--md-on-surface-variant);margin-bottom:6px;">KEY SCRIPTURES</div>` +
        pin.verses.map(v => `<div style="padding:4px 0;color:var(--md-primary);font-size:13px;font-weight:600;">📖 ${v}</div>`).join('') : ''}
    </div>
  `, true);
}
