function initAIChat() {
  const msgs = document.getElementById('chat-messages');
  const welcomeMsg = {
    role: 'assistant',
    content: `**Welcome to the AI Bible Scholar!** 🙏\n\nI'm here to help you with:\n• Theological questions & word studies\n• Cross-reference exploration\n• Historical & cultural context\n• Character studies & genealogy\n\nTo get started, please configure your API key (OpenAI or Gemini) using the ⚙️ button above.\n\n*"Your word is a lamp to my feet and a light to my path." — Psalm 119:105*`
  };
  APP_STATE.chatHistory = [welcomeMsg];
  renderChatMessages();
}

function renderChatMessages() {
  const container = document.getElementById('chat-messages');
  container.innerHTML = APP_STATE.chatHistory.map(msg => {
    if (msg.role === 'system') return `<div class="chat-bubble system">${msg.content}</div>`;
    const isUser = msg.role === 'user';
    return `<div class="chat-bubble ${isUser ? 'user' : 'ai'}">${formatChatText(msg.content)}</div>`;
  }).join('');
  container.scrollTop = container.scrollHeight;
}

function formatChatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>')
    .replace(/•/g, '•');
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';

  APP_STATE.chatHistory.push({role: 'user', content: text});
  renderChatMessages();

  // Show typing indicator
  const container = document.getElementById('chat-messages');
  const typing = document.createElement('div');
  typing.className = 'chat-bubble ai';
  typing.innerHTML = '<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  container.appendChild(typing);
  container.scrollTop = container.scrollHeight;

  document.getElementById('chat-send').disabled = true;

  try {
    const response = await callAIAPI(text);
    typing.remove();
    APP_STATE.chatHistory.push({role: 'assistant', content: response});
  } catch (err) {
    typing.remove();
    let errMsg = '';
    if (!navigator.onLine) {
      errMsg = '📵 **No internet connection.** Your notes and highlights are saved offline, but the AI assistant requires network access. Please connect and try again.';
    } else if (!APP_STATE.aiApiKey) {
      errMsg = '🔑 **API key not configured.** Please tap the ⚙️ button above to enter your OpenAI or Gemini API key.\n\n*Your key is stored locally and never sent to our servers.*';
    } else {
      errMsg = `⚠️ **Error:** ${err.message || 'Unable to reach the AI service. Please check your API key and try again.'}`;
    }
    APP_STATE.chatHistory.push({role: 'assistant', content: errMsg});
  }

  document.getElementById('chat-send').disabled = false;
  renderChatMessages();
}

async function callAIAPI(userMessage) {
  if (!APP_STATE.aiApiKey) throw new Error('No API key configured');

  const systemPrompt = `You are an expert Biblical scholar with deep knowledge of biblical theology, ancient history, biblical languages (Hebrew, Greek, Aramaic), church history, and hermeneutics. You specialize in the ESV (English Standard Version) translation.

Current reading context: ${BIBLE_BOOKS.find(b=>b.id===APP_STATE.currentBook)?.name} ${APP_STATE.currentChapter}

Guidelines:
- Provide accurate, scholarly responses grounded in Scripture
- Reference specific Bible passages (Book Chapter:Verse format)
- For word studies, include original Hebrew/Greek terms when relevant
- Note different theological perspectives where they exist (Reformed, Arminian, Catholic, etc.)
- Keep responses clear, warm, and pastoral in tone
- For historical context, reference ancient Near Eastern background
- Always cite Scripture references in ESV`;

  if (APP_STATE.aiProvider === 'gemini') {
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${APP_STATE.aiApiKey}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        contents: [{role:'user', parts:[{text: systemPrompt + '\n\nUser: ' + userMessage}]}],
        generationConfig: {temperature: 0.7, maxOutputTokens: 1024}
      })
    });
    if (!resp.ok) throw new Error(`Gemini API error: ${resp.status}`);
    const data = await resp.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response generated.';
  } else {
    // OpenAI
    const resp = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${APP_STATE.aiApiKey}`},
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [
          {role: 'system', content: systemPrompt},
          ...APP_STATE.chatHistory.filter(m => m.role !== 'system').map(m => ({role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content})),
        ],
        max_tokens: 1024,
        temperature: 0.7
      })
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `OpenAI API error: ${resp.status}`);
    }
    const data = await resp.json();
    return data.choices?.[0]?.message?.content || 'No response generated.';
  }
}

function quickNav(ref) {
  const parts = ref.split(' ');
  const bookName = parts.slice(0,-1).join(' ');
  const chap = parseInt(parts[parts.length-1]);
  const book = BIBLE_BOOKS.find(b => b.name.toLowerCase().includes(bookName.toLowerCase()) || b.abbr.toLowerCase() === bookName.toLowerCase());
  if (book && chap) {
    APP_STATE.currentBook = book.id;
    APP_STATE.currentChapter = chap;
    closeModal();
    fetchAndCacheBook(book.id).then(() => {
      buildBookList();
      updateChapterDisplay();
      renderChapter();
      renderRightPanel();
      switchTab('reader', document.getElementById('nav-reader'));
    });
  }
}

function runSearch(query) {
  const q = query.toLowerCase().trim();
  const container = document.getElementById('search-results');
  if (!q || q.length < 2) {
    container.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--md-on-surface-variant);">Type at least 2 characters to search...</div>';
    return;
  }

  let results = [];
  // Search through all loaded Bible data
  Object.entries(APP_STATE.bibleData).forEach(([bookId, chapters]) => {
    const bookMeta = BIBLE_BOOKS.find(b => b.id === bookId);
    Object.entries(chapters).forEach(([chapNum, verses]) => {
      Object.entries(verses).forEach(([verseNum, text]) => {
        if (text.toLowerCase().includes(q)) {
          results.push({bookId, chapNum, verseNum, text, ref: `${bookMeta.name} ${chapNum}:${verseNum}`});
        }
      });
    });
  });

  if (results.length === 0) {
    container.innerHTML = `<div class="empty-state"><span class="material-icons-round">search_off</span><p>No results for "${escapeHTML(query)}"<br>Try different terms or load more books.</p></div>`;
    return;
  }

  const maxResults = Math.min(results.length, 50);
  const highlighted = (text) => text.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);

  container.innerHTML = `<div style="padding:8px 16px;font-size:12px;color:var(--md-on-surface-variant);">${results.length} result${results.length!==1?'s':''} found${results.length>50?' (showing 50)':''}</div>` +
    results.slice(0, maxResults).map(r =>
      `<div class="search-result-item" onclick="navigateToVerseFromSearch('${r.bookId}', ${r.chapNum}, ${r.verseNum})">
        <div class="search-result-ref">${r.ref}</div>
        <div class="search-result-text">${highlighted(escapeHTML(r.text))}</div>
      </div>`
    ).join('');
}

async function navigateToVerseFromSearch(bookId, chap, verse) {
  APP_STATE.currentBook = bookId;
  APP_STATE.currentChapter = parseInt(chap);
  closeModal();
  await fetchAndCacheBook(bookId);
  buildBookList();
  updateChapterDisplay();
  renderChapter();
  renderRightPanel();
  switchTab('reader', document.getElementById('nav-reader'));
  setTimeout(() => {
    const el = document.getElementById(`verse-${verse}`);
    if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 300);
}

function clearCache() {

    APP_STATE.bibleData = {...BIBLE_SEED};

        tx.objectStore('bibleText').clear();

    closeModal();
    showToast('Cache cleared. Data will reload from network.');
    renderChapter();
  }
}

// ------------------------------------------------------------
// Bible text cache (Firestore) — shared across all devices/users so
// a book only ever needs to be fetched from the ESV API once, total.
// ------------------------------------------------------------
async function loadBookFromFirestore(bookId) {
  if (!firestoreDb) return null;
  const doc = await firestoreDb.collection('bibleCache').doc(bookId).get();
  if (!doc.exists) return null;
  const data = doc.data();
  return data?.chapters || null;
}

async function saveBookToFirestore(bookId, converted) {
  if (!firestoreDb) return;
  try {
    await firestoreDb.collection('bibleCache').doc(bookId).set({
      chapters: converted,
      source: 'esv',
      cachedAt: Date.now(),
    });
  } catch (e) {
    // Non-critical — the book still loaded fine from the API and is
    // cached locally in IndexedDB either way.
    console.warn(`Could not save ${bookId} to Firestore cache:`, e);
  }
}

async function syncToFirestore(userId) {
  if (!firestoreDb) return;
  try {
    await firestoreDb.collection('users').doc(userId).set({
      highlights: APP_STATE.highlights,
      notes: APP_STATE.notes,
      bookmarks: APP_STATE.bookmarks,
      lastSync: new Date().toISOString(),
      readingPosition: {book: APP_STATE.currentBook, chapter: APP_STATE.currentChapter}
    }, {merge: true});
    showToast('Synced to cloud ☁️');
  } catch(e) {
    console.warn('Firestore sync failed:', e);
  }
}

// Sign in with Google
function signInWithGoogle() {
  if (!auth || !provider) {
    showToast('Sign-in not ready yet — try again in a moment.');
    return;
  }
  auth.signInWithPopup(provider)
    .then(result => {
      const user = result.user;

      syncToFirestore(user.uid);
    })
    .catch(error => showToast('Sign-in failed: ' + error.message));
}

// Load data from Firestore
async function loadFromFirestore(userId) {
  const doc = await firestoreDb.collection('users').doc(userId).get();
  if (doc.exists) {
    const data = doc.data();
    // Merge with local data (local data wins for conflicts)
    APP_STATE.highlights = { ...data.highlights, ...APP_STATE.highlights };
    APP_STATE.notes = { ...data.notes, ...APP_STATE.notes };
    // Merge bookmarks (deduplicate by key)
    const allBookmarks = [...APP_STATE.bookmarks, ...(data.bookmarks || [])];
    APP_STATE.bookmarks = allBookmarks.filter((bm, idx, arr) => 
      arr.findIndex(b => b.key === bm.key) === idx
    );
    renderChapter(); // Re-render with cloud highlights
    renderNotesTab();
  }
}

// MODAL SYSTEM
// ============================================================
function showModal(content, isSheet = false) {
  const modals = document.getElementById('modals');
  const overlay = document.createElement('div');
  overlay.className = `modal-overlay${isSheet ? '' : ' centered'}`;
  overlay.id = 'active-modal';
  const card = document.createElement('div');
  card.className = isSheet ? 'bottom-sheet' : 'dialog-card';
  card.innerHTML = content;
  overlay.appendChild(card);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });
  modals.innerHTML = '';
  modals.appendChild(overlay);
  if (isSheet) makeSheetDraggable(card);
}

// Global drag-to-resize for every bottom-sheet modal: dragging the handle
// adjusts the sheet's height directly, and once it's dragged past 3/4 of
// the screen it snaps the rest of the way to full height automatically.
function makeSheetDraggable(card) {
  const handle = card.querySelector('.sheet-handle');
  if (!handle) return;
  handle.style.cursor = 'grab';
  handle.style.touchAction = 'none';

  const MIN_HEIGHT = 160; // px — floor while actively dragging (above the close threshold)
  let dragging = false;
  let startY = 0;
  let startHeight = 0;

  const getY = (e) => (e.touches ? e.touches[0].clientY : e.clientY);

  function stopListening() {
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
  }

  function onMove(e) {
    if (!dragging) return;
    if (e.cancelable) e.preventDefault();
    const maxHeight = window.innerHeight;
    const delta = startY - getY(e);
    const rawHeight = startHeight + delta;

    // Dragged down past 1/4 of the screen height — close right away,
    // don't wait for release.
    if (rawHeight <= maxHeight * 0.25) {
      dragging = false;
      card.style.transition = '';
      stopListening();
      closeModal();
      return;
    }

    let newHeight = Math.max(MIN_HEIGHT, Math.min(maxHeight, rawHeight));
    // Snap to full screen once dragged past 3/4 of the viewport height
    if (newHeight >= maxHeight * 0.75) newHeight = maxHeight;
    card.style.height = newHeight + 'px';
    card.style.maxHeight = '100vh';
  }

  function onEnd() {
    dragging = false;
    card.style.transition = '';
    stopListening();
  }

  function onStart(e) {
    dragging = true;
    startY = getY(e);
    startHeight = card.getBoundingClientRect().height;
    card.style.transition = 'none';
    document.addEventListener('touchmove', onMove, {passive: false});
    document.addEventListener('touchend', onEnd);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
  }

  handle.addEventListener('touchstart', onStart, {passive: true});
  handle.addEventListener('mousedown', onStart);
}

function closeModal() {
  document.getElementById('modals').innerHTML = '';
}

// ============================================================
// TOAST NOTIFICATION
// ============================================================
function showToast(msg, duration = 2500) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

// ============================================================
// SWIPE GESTURES
// ============================================================
function setupSwipeGestures() {
  let startX = 0, startY = 0;
  const reader = document.getElementById('reader-area');

  reader.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, {passive: true});

  reader.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) navigateChapter(1);
      else navigateChapter(-1);
    }
  }, {passive: true});
}

function navigateToRef(bookId, verseRef) {
  const parts = verseRef.split(':');
  const chap = parseInt(parts[0]);
  if (!isNaN(chap)) {
    APP_STATE.currentBook = bookId;
    APP_STATE.currentChapter = chap;
    fetchAndCacheBook(bookId).then(() => {
      buildBookList();
      updateChapterDisplay();
      renderChapter();
      renderRightPanel();
      switchTab('reader', document.getElementById('nav-reader'));
    });
  }
}
